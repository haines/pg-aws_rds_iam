name: Release

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  rubygems:
    name: Push gem to RubyGems

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Ruby
        uses: ./.github/actions/setup-ruby
        with:
          bundle-install: default
          bundler-cache: false

      - name: Generate release notes
        run: bin/rake release:notes

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@762a4b77c3300434bb57c7ce80b20e36231927aa # main

      - name: Push gem to RubyGems
        id: gem-push
        run: bin/rake release:push

      - name: Upload release artifacts
        if: always() && (steps.gem-push.outcome == 'success' || steps.gem-push.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: pkg/

  github:
    name: Publish release to GitHub

    needs: rubygems

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Publish release to GitHub
        run: |-
          version=$(< version.txt)
          gh release create \
            "v${version}" \
            "pg-aws_rds_iam-${version}.gem" \
            "pg-aws_rds_iam-${version}.gem.sigstore.json" \
            --notes-file release.md \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
