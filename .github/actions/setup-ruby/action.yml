name: Set up Ruby

description: Install Ruby and gems

inputs:
  bundle-install:
    description: Gem groups to install
    default: none

  bundler-cache:
    description: Cache gems?
    default: "true"

  ruby-version:
    description: Version of Ruby to install
    default: default

runs:
  using: composite

  steps:
    - name: Set environment variables
      run: |-
        cat <<EOF >> "${GITHUB_ENV}"
        BUNDLE_DEPLOYMENT=true
        BUNDLE_ONLY=${BUNDLE_ONLY}
        BUNDLE_PATH=${BUNDLE_PATH}
        EOF
      shell: bash
      env:
        BUNDLE_ONLY: ${{ inputs.bundle-install }}
        BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle

    - name: Install Ruby${{ inputs.bundle-install != 'none' && inputs.bundler-cache == 'true' && ' and gems' || '' }}
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        bundler-cache: ${{ inputs.bundle-install != 'none' && inputs.bundler-cache == 'true' }}
        ruby-version: ${{ inputs.ruby-version }}

    - name: Update RubyGems
      run: ruby -r rubygems/bundler_version_finder -e 'exec "gem", "update", "--system", Gem::BundlerVersionFinder.bundler_version.to_s'
      shell: bash

    - name: Install gems
      if: inputs.bundle-install != 'none' && inputs.bundler-cache != 'true'
      run: bundle install
      shell: bash
